<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Piece MM | Secret Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #060b12;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #00ff99;
            background-color: #0c1422;
            box-shadow: 0 0 20px rgba(0, 255, 153, 0.2);
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 { color: #00ff99; margin: 0; font-size: 2.5rem; letter-spacing: -1px; }
        p { color: #94a3b8; margin: 5px 0; font-size: 1.2rem; }

        .back-btn {
            margin-top: 25px;
            padding: 12px 24px;
            background: #1e293b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: #00ff99;
            color: black;
            box-shadow: 0 0 15px rgba(0, 255, 153, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GPO SNAKE</h1>
        <p>Score: <span id="score">0</span></p>
    </div>

    <canvas id="snakeGame" width="400" height="400"></canvas>

    <a href="index.html" class="back-btn">Back to Marketplace</a>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let box = 20;
        let score = 0;
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };
        let d;
        let gameActive = true;

        document.addEventListener("keydown", direction);

        function direction(event) {
            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function sendToDiscord(finalScore) {
            const playerName = prompt("Game Over! Enter your name for the leaderboard:", "Anonymous");
            // Your Live Webhook URL
            const webhookURL = "https://discord.com/api/webhooks/1472250942266277939/UAkk3_vo8qbfURbiHFi0oNleTKDF5e-Bn7mlPh-Fku8UI_jLWuV_LEv_EeawsZLYqEXQ"; 

            if (playerName) {
                fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🐍 **New High Score!**\n**Player:** \`${playerName}\` \n**Score:** \`${finalScore}\``
                    })
                }).then(() => {
                    location.reload();
                }).catch(err => {
                    location.reload();
                });
            } else {
                location.reload();
            }
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function draw() {
            if (!gameActive) return;

            ctx.fillStyle = "#0c1422";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#00ff99" : "#00c870";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#060b12";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#ff2b5b";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerHTML = score;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                gameActive = false;
                clearInterval(gameInterval);
                sendToDiscord(score);
            }

            snake.unshift(newHead);
        }

        let gameInterval = setInterval(draw, 100);
    </script>
</body>
</html>
